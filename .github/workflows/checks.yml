name: Configuration checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua parser and JSON validator
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Run static checks
        run: bash scripts/check.sh

      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check lua/soul/core/autocmds.lua lua/soul/core/helpers/dashboard/alpha/autocmds.lua lua/soul/core/helpers/dashboard/footer.lua lua/soul/core/helpers/paths.lua lua/soul/core/keymaps.lua lua/soul/lsp/lsp.lua lua/soul/plugins/lualine.lua lua/soul/plugins/undotree.lua scripts/check-nvim.lua
