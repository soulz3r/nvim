name: Configuration checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua parser and JSON validator
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 python3

      - name: Run static checks
        run: bash scripts/check.sh
