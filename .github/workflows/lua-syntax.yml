name: Lua syntax

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Check Lua syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Parse Lua files
        shell: bash
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 luac -p
